<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Change Color</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        #color_area {
            height: 400px;
            background-color: rgb(239, 114, 204);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="row">
            <div class="col" id="color_area"></div>
        </div>
        <div class="row mt-4">
            <div class="col">
                <button type="button" class="btn btn-danger"
                onclick="ubahwarna('red')">Merah</button>
            </div>
            <div class="col">
                <button type="button" class="btn btn-primary"
                onclick="ubahwarna('blue')">Biru</button>
            </div>
            <div class="col">
                <button type="button" class="btn btn-success"
                onclick="ubahwarna('green')">Hijau</button>
            </div>
            <div class="col">
                <button type="button" class="btn btn-warning"
                onclick="ubahwarna('yellow')">Kuning</button>
            </div>
            <div class="col">
                <button type="button" class="btn"
                style="background-color: rgb(235, 114, 217);" 
                onclick="ubahwarna('Pink')">Pink</button>
            </div>
            <br>
            <div class="alert alert-light text-center" role="alert">
                Refania Azhari Siregar | 25/561443/SV/26581 | PGWEB B
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script>
        //function untuk mengubah warna menjadi merah
        // function merah(red) {
        //     document.getElementById("color_area").style.backgroundColor = "Red";
        // }
        // function biru(blue) {
        //     document.getElementById("color_area").style.backgroundColor = "Blue";
        // }
        // function hijau(green) {
        //     document.getElementById("color_area").style.backgroundColor = "Green";
        // }
        // function kuning(yellow) {
        //     document.getElementById("color_area").style.backgroundColor = "Yellow";
        // }

        //untuk membuat banyak fungsi
        function ubahwarna(color) {
            document.getElementById("color_area").style.backgroundColor = color;
        }
        
    </script>
</body>

</html>
