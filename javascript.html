<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title>
</head>
<body>
    Nama: <i id="value_nama"></i>
    <br>
    Umur: <i id="value_umur"></i>
    <script>
        var nama = "Refa";

        //umur
        let umur = 18

        let tinggi = 155

        //array
        let film_favorit = ["The Devil Wears Prada", "Spiderman"]

        //menampilkan console ke jendela
        console.log("nama: " + nama);
        console.log('umur: ' + umur);
        console.log("tinggi: " + tinggi + "cm");
        console.log("film favorit: "+ film_favorit[1])

        //arithmatic operations
        let a = 9;
        let b = 7;
        let jumlah  = a + b;
        console.log("Hasil penjumlahan a & b = " + jumlah);
        
        let kurang = a - b;
        console.log("Hasil pengurangan a & b = " + kurang);

        let perkalian = a * b;
        console.log("Hasil perkalian a & b = " + perkalian);

        let pembagian = a / b;
        console.log("Hasil pembagian a & b = " + pembagian);

        let sisa = a % b;
        console.log("Hasil sisa a & b = " + sisa);

        let pangkat = a **2;
        console.log("Hasil pangkat a = " + pangkat);

        //conditional statement
        let nilai = 84
        if (nilai >= 90){
            console.log("Nilai: A");
        } else if (nilai >=80) {
            console.log("Nilai: B");
        } else if (nilai >=70){;
            console.log("Nilai: C");
    } else {
                console.log("Nilai D");
            }

        //function
        function penjumlahan(a,b) {
            return console.log("Hasil Penjumlahan: " + (a+b));
        }

        //memanggil fungsi penjumlahan
        penjumlahan(8, 5);

        //menampilkan nama ke halaman web (DOM)
        document.getElementById("value_nama").innerHTML = nama;
        document.getElementById("value_umur").innerHTML = umur + "tahun";

    </script>
</body>
</html>
